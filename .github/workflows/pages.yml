name: Deploy demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: |
          mkdir -p public/src public/assets public/examples public/test
          cp index.html style.css icon.svg lab.html lab.css public/
          cp src/*.js public/src/
          cp assets/*.jpg public/assets/
          cp examples/*.html examples/*.js public/examples/
          cp test/browser.html test/browser.js public/test/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
