<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inline composer — Open Glass</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(at 70% 10%,#223c68,#0a1124 65%);font:15px system-ui;color:#dce9ff;min-height:100dvh;padding:40px 20px}main{max-width:760px;margin:80px auto}a{color:#a5c8ff}h1{font-size:36px;letter-spacing:-1px;font-weight:450}form{padding:22px;border-radius:20px;background:linear-gradient(135deg,#f9fbff,#eaf1fc);margin-top:35px;border:1px solid #b6c9e8}textarea{border:0;background:none;width:100%;resize:vertical;min-height:70px;outline-offset:5px;font:16px system-ui;color:#20375c}.toolbar{display:flex;justify-content:flex-end;align-items:center;gap:10px}#recorder{width:300px;height:126px}button[type=submit]{background:#203b67;border:0;border-radius:10px;color:white;padding:12px;font:20px system-ui;cursor:pointer}#messages{list-style:none;padding:0}li{background:#ffffff0b;border:1px solid #ffffff17;border-radius:12px;padding:18px;margin:15px 0;white-space:pre-wrap}audio{width:100%;margin-top:12px}#status{font-size:12px;color:#9eb7dc}@media(max-width:500px){main{margin:35px auto}.toolbar{gap:3px}#recorder{width:min(260px,calc(100vw - 118px));height:126px}form{padding:16px}}</style></head><body><main><a href="../lab.html">← Component lab</a><h1>A recorder, inside your composer.</h1><p>Same open-source module. A wider navy finish.</p><ul id="messages" aria-live="polite"></ul><form><label for="message">Your message</label><textarea id="message" placeholder="Type a thought…"></textarea><div class="toolbar"><div id="recorder"></div><button type="submit" aria-label="Send message">↑</button></div></form><p id="status" role="status">Voice notes stay in this tab.</p></main><script type="module" src="composer.js"></script></body></html>
